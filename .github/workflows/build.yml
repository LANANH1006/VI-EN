name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giải nén source (nếu repo chỉ có file zip)
        id: prep
        run: |
          if [ -f vi-recipe-mod-source.zip ]; then
            unzip -q vi-recipe-mod-source.zip -d extracted
          fi
          if [ -d extracted/vi-recipe-mod ]; then
            echo "project_dir=extracted/vi-recipe-mod" >> "$GITHUB_OUTPUT"
          else
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build with Gradle
        working-directory: ${{ steps.prep.outputs.project_dir }}
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: vi-recipe-helper
          path: ${{ steps.prep.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
